<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aplikasi Digital TBM K3</title>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Hubungkan ke file CSS utama -->
    <link rel="stylesheet" href="style.css">
    <!-- Hubungkan ke file CSS khusus login -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-area">
                    <i class="fa-solid fa-hard-hat"></i>
                </div>
                <h1>Aplikasi Digital TBM K3</h1>
                <p>Silakan masuk untuk melanjutkan sesi</p>
            </div>

            <!-- Pesan Error jika Login Gagal -->
            <div id="errorAlert" class="error-msg">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText">Username atau Password salah!</span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <div style="position: relative;">
                        <input type="text" id="username" placeholder="Masukkan username..." required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <div style="position: relative;">
                        <input type="password" id="password" placeholder="Masukkan password..." required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk
                </button>
            </form>
        </div>
    </div>

    <!-- Hubungkan ke file JavaScript eksternal khusus login -->
    <script src="login.js"></script>
</body>
</html>
